name: Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-sponsors:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Patreon Token
        id: patreon-token
        run: |
          RESPONSE=$(curl -fsS -X POST https://www.patreon.com/api/oauth2/token \
            -d 'grant_type=refresh_token' \
            -d "client_id=${{ secrets.SPONSORKIT_PATREON_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.SPONSORKIT_PATREON_CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.SPONSORKIT_PATREON_REFRESH_TOKEN }}")
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to get access_token from Patreon: $RESPONSE"
            exit 1
          fi
          REFRESH_TOKEN=$(echo "$RESPONSE" | jq -r '.refresh_token')
          if [ -z "$REFRESH_TOKEN" ] || [ "$REFRESH_TOKEN" = "null" ]; then
            echo "::error::Failed to get refresh_token from Patreon: $RESPONSE"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$REFRESH_TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "refresh_token=$REFRESH_TOKEN" >> $GITHUB_OUTPUT

      - name: Update Patreon Refresh Token Secret
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "${{ steps.patreon-token.outputs.refresh_token }}" | \
            gh secret set SPONSORKIT_PATREON_REFRESH_TOKEN

      - name: Setup Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn

      - name: Install dependencies
        run: yarn --immutable

      - name: Update sponsors
        run: yarn build
        env:
          SPONSORKIT_GITHUB_TOKEN: ${{ secrets.SPONSORKIT_GITHUB_TOKEN }}
          SPONSORKIT_GITHUB_LOGIN: ${{ secrets.SPONSORKIT_GITHUB_LOGIN }}
          SPONSORKIT_PATREON_TOKEN: ${{ steps.patreon-token.outputs.token }}
          SPONSORKIT_OPENCOLLECTIVE_KEY: ${{ secrets.SPONSORKIT_OPENCOLLECTIVE_KEY }}
          SPONSORKIT_OPENCOLLECTIVE_SLUG: ${{ secrets.SPONSORKIT_OPENCOLLECTIVE_SLUG }}
          SPONSORKIT_OPENCOLLECTIVE_TYPE: ${{ secrets.SPONSORKIT_OPENCOLLECTIVE_TYPE }}
          SPONSORKIT_AFDIAN_USER_ID: ${{ secrets.SPONSORKIT_AFDIAN_USER_ID }}
          SPONSORKIT_AFDIAN_TOKEN: ${{ secrets.SPONSORKIT_AFDIAN_TOKEN }}

      - name: Commit
        uses: EndBug/add-and-commit@645ecc0dd0a57f4d86d26c0aa5fc42c0a856fbca # v11.0.0
        with:
          message: 'chore: update sponsors.svg'
          add: 'sponsors.*'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
